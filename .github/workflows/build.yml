name: Build SubGuard Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Verify and Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fetch Gradle Wrapper Jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.0'

      - name: Remove stale lockfile and old registrant artifacts
        run: |
          rm -f pubspec.lock
          find android -iname "GeneratedPluginRegistrant*" -print -delete || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subguard-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: subguard-aab
          path: build/app/outputs/bundle/release/app-release.aab

  crash-diagnose:
    name: Install on Emulator and Capture Crash Log
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: subguard-apk
          path: apk

      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run on Android Emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            adb install apk/app-release.apk
            adb shell monkey -p com.example.subguard -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d > emulator_logcat.txt

      - name: Upload Crash Log
        uses: actions/upload-artifact@v4
        with:
          name: crash-logcat
          path: emulator_logcat.txt
