name: Build SubGuard Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Verify and Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.0'

      - name: Remove stale lockfile and old registrant artifacts
        run: |
          rm -f pubspec.lock
          find android -iname "GeneratedPluginRegistrant*" -print -delete || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Gradle Wrapper (in scratch dir to avoid evaluating our settings.gradle)
        run: |
          if [ ! -f android/gradlew ]; then
            mkdir -p /tmp/gradle-wrapper-scratch
            cd /tmp/gradle-wrapper-scratch
            gradle wrapper --gradle-version 8.11.1
            mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
            cp -r gradle/wrapper/* "$GITHUB_WORKSPACE/android/gradle/wrapper/"
            cp gradlew "$GITHUB_WORKSPACE/android/gradlew"
            cp gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
            chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          fi

      - name: Flutter Clean
        run: flutter clean && flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subguard-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: subguard-aab
          path: build/app/outputs/bundle/release/app-release.aab
