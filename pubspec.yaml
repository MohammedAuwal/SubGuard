name: subguard
description: A premium offline-first subscription tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.4.3
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_local_notifications: ^17.1.2
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.4
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  timezone: ^0.9.2
  flutter_timezone: ^1.0.8
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true
